name: Deploy Jall Admin

on:
  push:
    branches:
      - main
    paths:
      - 'jall-admin/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jall-admin/package-lock.json

      - name: Install dependencies
        working-directory: jall-admin
        run: npm install --frozen-lockfile || npm install

      - name: Build
        working-directory: jall-admin
        env:
          VITE_API_URL: ""
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            rm -rf ~/jall-admin-dist-old
            mv ~/jall-admin-dist ~/jall-admin-dist-old

      - name: Upload dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "jall-admin/dist/*"
          target: "/home/ec2-user/jall-admin-dist"
          strip_components: 2

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx
