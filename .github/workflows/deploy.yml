name: Deploy Jall API

on:
  push:
    branches:
      - main
    paths:
      - "jall-api/**"
      - ".github/workflows/deploy.yml"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jall
          POSTGRES_PASSWORD: jall_secret
          POSTGRES_DB: jalldb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jall -d jalldb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jall-api/package-lock.json

      - name: Install dependencies
        working-directory: jall-api
        run: npm install --frozen-lockfile || npm install

      - name: Apply schema
        working-directory: jall-api
        env:
          DATABASE_URL: postgresql://jall:jall_secret@localhost:5432/jalldb
        run: npm run db:migrate

      - name: Run tests
        working-directory: jall-api
        env:
          DATABASE_URL: postgresql://jall:jall_secret@localhost:5432/jalldb
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: 5009
        run: npm test

      - name: Deploy to EC2 via SSH
        env:
          DATABASE_URL: ${{ secrets.DB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: DATABASE_URL,JWT_SECRET,DEPLOY_SHA
          script: |
            set -e
            cd ~/jall
            git fetch --depth=1 origin "$DEPLOY_SHA"
            git checkout --force "$DEPLOY_SHA"
            cd jall-api
            npm install --omit=dev
            DATABASE_URL="$DATABASE_URL" npm run db:migrate
            JWT_SECRET="$JWT_SECRET" DATABASE_URL="$DATABASE_URL" pm2 restart jall-api --update-env || JWT_SECRET="$JWT_SECRET" DATABASE_URL="$DATABASE_URL" pm2 start server.js --name jall-api --update-env
            pm2 save
