name: Deploy Jall API

on:
  push:
    branches:
      - main
    paths:
      - "jall-api/**"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jall
          POSTGRES_PASSWORD: jall_secret
          POSTGRES_DB: jalldb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jall -d jalldb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jall-api/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        working-directory: jall-api
        run: npm ci

      - name: Seed test database
        env:
          PGPASSWORD: jall_secret
        run: psql -h localhost -U jall -d jalldb -f jall-api/src/db/schema.sql

      - name: Run tests
        working-directory: jall-api
        env:
          DATABASE_URL: postgresql://jall:jall_secret@localhost:5432/jalldb
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: 5009
        run: npm test

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/jall
            git pull origin main
            cd jall-api
            npm ci --omit=dev
            pm2 restart jall-api || pm2 start server.js --name jall-api
            pm2 save
